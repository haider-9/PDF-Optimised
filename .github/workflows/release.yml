name: Release

# Runs when a version tag such as v0.1.0 is pushed. It can also be started by
# hand from the Actions tab to test the packaging without publishing.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: Linux AppImage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config \
            qt6-base-dev libmupdf-dev libgl1-mesa-dev libfuse2t64 \
            libfreetype-dev libharfbuzz-dev libjpeg-dev libopenjp2-7-dev \
            libjbig2dec-dev libgumbo-dev libz-dev

      - name: Build
        run: |
          # Qt's Ubuntu libraries depend on several system libraries (HarfBuzz,
          # FreeType, ...) that the link line does not list. This linker option
          # records those indirect dependencies so the link succeeds.
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXE_LINKER_FLAGS="-Wl,--copy-dt-needed-entries"
          cmake --build build

      - name: Package AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          QMAKE: /usr/lib/qt6/bin/qmake6
          DEPLOY_QT_PLATFORM: xcb
        run: |
          set -euo pipefail
          curl -fsSL -o linuxdeploy \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -fsSL -o linuxdeploy-plugin-qt \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy linuxdeploy-plugin-qt
          # linuxdeploy looks for its Qt plugin on PATH.
          export PATH="$PWD:$PATH"

          ./linuxdeploy \
            --appdir AppDir \
            --executable build/CanvasPDF \
            --desktop-file packaging/CanvasPDF.desktop \
            --icon-file packaging/canvaspdf.png \
            --plugin qt \
            --output appimage

          mv CanvasPDF*.AppImage CanvasPDF-linux-x86_64.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: CanvasPDF-linux-x86_64.AppImage

  windows:
    name: Windows zip
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-tools
            mingw-w64-ucrt-x86_64-mupdf
            zip

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Collect runtime files
        run: |
          set -euo pipefail
          rm -rf dist && mkdir dist
          cp build/CanvasPDF.exe dist/
          # Qt platform plugins, styles and image formats.
          # The MSYS2 tool name varies between Qt releases; use whichever exists.
          deployqt="$(command -v windeployqt-qt6 || command -v windeployqt)"
          "$deployqt" --release --no-translations dist/CanvasPDF.exe
          # Every MSYS2 DLL the executable needs (Qt, MuPDF, runtime).
          ldd dist/CanvasPDF.exe | awk '/ucrt64/ {print $3}' | while read -r dll; do
            cp -n "$dll" dist/ || true
          done
          cp LICENSE dist/

      - name: Zip
        run: |
          set -euo pipefail
          (cd dist && zip -qr "$GITHUB_WORKSPACE/CanvasPDF-windows-x64.zip" .)

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: CanvasPDF-windows-x64.zip

  publish:
    name: Publish release
    needs: [linux, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            CanvasPDF-linux-x86_64.AppImage
            CanvasPDF-windows-x64.zip
            LICENSE
